name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x migrate.sh lib/*.sh

      - name: bash syntax check
        run: |
          bash -n migrate.sh lib/*.sh

      - name: help smoke test
        run: |
          ./migrate.sh help
          ./migrate.sh 2>&1 | grep -q audit

      - name: unknown command exits non-zero
        run: |
          if ./migrate.sh frobnicate; then exit 1; fi

      - name: refuses to run without config
        run: |
          if ./migrate.sh audit; then exit 1; fi
